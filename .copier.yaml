---
# Copier template configuration.
# https://copier.readthedocs.io/

# Skip these files when generating a new project.
# NOTE: this REPLACES Copier's defaults, so the standard excludes
# (copier.yaml, .git, __pycache__, etc.) must be re-listed.
_exclude:
  - "copier.yaml"
  - "copier.yml"
  - ".copier.yaml"
  - ".copier.yml"
  - ".git/"
  - ".github/"
  - ".env"

# --- Jinja extensions ---

# Required for `{{ now() }}` (used in LICENSE year).
_jinja_extensions:
  - jinja2_time.TimeExtension

# --- Prompts ---

project_name:
  type: str
  help: "Human-readable project name (e.g. 'Order Pipeline'). Used in LICENSE and README."

include_data_eng:
  type: bool
  default: false
  help: "Include data-engineering standards (Spark, SQL, data contracts)?"

# --- Post-copy message ---

_message_after_copy: |
  Project "{{ project_name }}" generated.

  Next steps:
    1. cd <destination>
    2. cp .env.example .env (edit values)
    3. make help (see available targets)
    4. git init && git add . && git commit -m "Initial commit"
